name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  app:
    name: App Verify And Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Verify app
        working-directory: app
        run: npm run verify

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Build verified production image
        working-directory: app
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          mkdir -p ../tmp/outputs ../tmp/screenshots
          npm run docker:build:verified -- --source gcr --scope ci --mode docker

          shopt -s nullglob
          receipts=(../tmp/outputs/docker-build-receipt-*.json)
          if [[ "${#receipts[@]}" -ne 1 ]]; then
            echo "Expected exactly one Docker build receipt, found ${#receipts[@]}"
            exit 1
          fi

          node - "${receipts[0]}" <<'NODE'
          import fs from 'node:fs';

          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (
            receipt.outcome !== 'built' ||
            receipt.scope !== 'ci' ||
            receipt.imageTag !== 'promptforge-app:ci' ||
            receipt.platform !== 'linux/amd64'
          ) {
            throw new Error('Docker build receipt does not match the fixed CI image contract');
          }
          NODE

          actual_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' promptforge-app:ci)"
          if [[ "$actual_platform" != "linux/amd64" ]]; then
            echo "Expected linux/amd64 image, got $actual_platform"
            exit 1
          fi
          docker image inspect promptforge-app:ci > ../tmp/outputs/ci-production-image-inspect.json

      - name: Start production image on random port
        run: |
          container_name="promptforge-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$container_name" > tmp/outputs/ci-container-name.txt
          docker run -d \
            --name "$container_name" \
            --platform linux/amd64 \
            -p 127.0.0.1::3000 \
            promptforge-app:ci > tmp/outputs/ci-container-id.txt

          endpoint="$(docker port "$container_name" 3000/tcp | head -n 1)"
          port="${endpoint##*:}"
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo "Unable to resolve the random localhost port"
            exit 1
          fi
          printf 'PROMPTFORGE_SMOKE_BASE_URL=http://127.0.0.1:%s/\n' "$port" >> "$GITHUB_ENV"

      - name: Wait for production image
        run: |
          container_name="$(<tmp/outputs/ci-container-name.txt)"
          for i in {1..60}; do
            if curl -fsS "${PROMPTFORGE_SMOKE_BASE_URL}api/trpc/ping?batch=1&input=%7B%7D" > /dev/null \
              && docker exec "$container_name" node -e '
                fetch("http://127.0.0.1:3000/api/trpc/ping?batch=1&input=%7B%7D")
                  .then(async response => {
                    const body = await response.text();
                    if (!response.ok || !body.includes("\"ok\"")) process.exit(1);
                  })
                  .catch(() => process.exit(1));
              ' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_name" > tmp/outputs/ci-production-image.log 2>&1
          cat tmp/outputs/ci-production-image.log
          exit 1

      - name: Run E2E smoke
        working-directory: app
        run: npm run smoke:e2e

      - name: Export verified image handoff
        if: github.event_name == 'push' && github.repository == 'zjgulai/ai-pm-library' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/catalog-plugin-refresh-202608')
        run: |
          set -euo pipefail
          mkdir -p tmp/image-handoff

          shopt -s nullglob
          receipts=(tmp/outputs/docker-build-receipt-*.json)
          if [[ "${#receipts[@]}" -ne 1 ]]; then
            echo "Expected exactly one Docker build receipt, found ${#receipts[@]}"
            exit 1
          fi

          node - "${receipts[0]}" <<'NODE'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';

          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const imageId = execFileSync(
            'docker',
            ['image', 'inspect', '--format', '{{.Id}}', 'promptforge-app:ci'],
            { encoding: 'utf8' },
          ).trim();
          if (
            receipt.outcome !== 'built' ||
            receipt.scope !== 'ci' ||
            receipt.sourceRevision !== process.env.GITHUB_SHA ||
            receipt.imageId !== imageId ||
            receipt.platform !== 'linux/amd64'
          ) {
            throw new Error('CI image handoff is not bound to the exact verified build receipt');
          }
          NODE

          cp "${receipts[0]}" tmp/image-handoff/docker-build-receipt.json
          docker save --output tmp/image-handoff/promptforge-app-ci.tar promptforge-app:ci
          (
            cd tmp/image-handoff
            sha256sum docker-build-receipt.json promptforge-app-ci.tar > SHA256SUMS
          )

      - name: Upload verified image handoff
        if: github.event_name == 'push' && github.repository == 'zjgulai/ai-pm-library' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/catalog-plugin-refresh-202608')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promptforge-ci-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/image-handoff/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Collect production image diagnostics
        if: always()
        run: |
          if [[ -s tmp/outputs/ci-container-name.txt ]]; then
            container_name="$(<tmp/outputs/ci-container-name.txt)"
            docker logs "$container_name" > tmp/outputs/ci-production-image.log 2>&1 || true
            docker inspect "$container_name" > tmp/outputs/ci-production-container-inspect.json 2>&1 || true
          fi

      - name: Stop production image
        if: always()
        run: |
          if [[ -s tmp/outputs/ci-container-name.txt ]]; then
            container_name="$(<tmp/outputs/ci-container-name.txt)"
            docker rm -f "$container_name" || true
          fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promptforge-smoke-artifacts
          path: |
            tmp/outputs/
            tmp/screenshots/
          if-no-files-found: ignore

  publish-ghcr:
    name: Publish Verified GHCR Image
    if: github.event_name == 'push' && github.repository == 'zjgulai/ai-pm-library' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/catalog-plugin-refresh-202608')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download verified image handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: promptforge-ci-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/image-handoff

      - name: Verify and load image handoff
        run: |
          set -euo pipefail
          (
            cd tmp/image-handoff
            sha256sum --check SHA256SUMS
          )
          docker load --input tmp/image-handoff/promptforge-app-ci.tar

          node - tmp/image-handoff/docker-build-receipt.json <<'NODE'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';

          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const imageId = execFileSync(
            'docker',
            ['image', 'inspect', '--format', '{{.Id}}', 'promptforge-app:ci'],
            { encoding: 'utf8' },
          ).trim();
          const platform = execFileSync(
            'docker',
            ['image', 'inspect', '--format', '{{.Os}}/{{.Architecture}}', 'promptforge-app:ci'],
            { encoding: 'utf8' },
          ).trim();
          if (
            receipt.outcome !== 'built' ||
            receipt.scope !== 'ci' ||
            receipt.sourceRevision !== process.env.GITHUB_SHA ||
            receipt.imageId !== imageId ||
            receipt.platform !== 'linux/amd64' ||
            platform !== 'linux/amd64'
          ) {
            throw new Error('Downloaded image handoff does not match the exact-head CI receipt');
          }
          NODE

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish exact-head image by immutable digest
        id: publish
        working-directory: app
        env:
          PROMPTFORGE_BUILD_RECEIPT_PATH: ../tmp/image-handoff/docker-build-receipt.json
          PROMPTFORGE_GHCR_RUN_ID: ghcr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bash scripts/publish-ghcr-image.sh
          receipt="../tmp/outputs/ghcr-publish-receipt-ghcr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          digest="$(jq -er '.publishedDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$receipt")"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/zjgulai/ai-pm-library
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true

      - name: Upload GHCR publish receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promptforge-ghcr-publish-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/outputs/ghcr-publish-receipt-*.json
          if-no-files-found: error
          retention-days: 30
