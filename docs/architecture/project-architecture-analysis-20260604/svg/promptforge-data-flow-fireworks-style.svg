<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-label="PromptForge data flow fireworks style">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#1e3a5f"/>
    </marker>
    <style>
      .title{font:700 32px ui-monospace,Menlo,monospace;fill:#1e40af}
      .sub{font:500 16px ui-monospace,Menlo,monospace;fill:#64748b}
      .label{font:700 17px ui-monospace,Menlo,monospace;fill:#374151}
      .small{font:500 13px ui-monospace,Menlo,monospace;fill:#64748b}
      .box{fill:#dbeafe;stroke:#1e40af;stroke-width:2.5;stroke-linejoin:round}
      .data{fill:#dcfce7;stroke:#166534}
      .gate{fill:#fef3c7;stroke:#b45309}
      .deploy{fill:#ffedd5;stroke:#9a3412}
      .future{fill:#e0f2fe;stroke:#0369a1;stroke-dasharray:8 6}
      .warn{fill:#fee2e2;stroke:#dc2626}
      .arrow{fill:none;stroke:#1e3a5f;stroke-width:2.2;marker-end:url(#arrow)}
      .dash{stroke-dasharray:8 6}
    </style>
  </defs>
  <rect x="0" y="0" width="1440" height="880" fill="#fff"/>
  <text x="60" y="64" class="title">PromptForge Data Flow</text>
  <text x="62" y="96" class="sub">Fireworks-style SVG fallback: staticData -> catalog JSON -> app -> browser, with future admin branch separated.</text>

  <rect x="60" y="140" width="1320" height="410" rx="22" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="85" y="178" class="label">Current static-first production lineage</text>

  <rect x="105" y="250" width="190" height="96" rx="18" class="box"/>
  <text x="128" y="286" class="label">Content Sources</text>
  <text x="128" y="314" class="small">official / GitHub / docs</text>
  <text x="128" y="334" class="small">human + AI curation</text>

  <rect x="365" y="235" width="210" height="126" rx="18" class="box data"/>
  <text x="392" y="275" class="label">staticData.ts</text>
  <text x="392" y="304" class="small">prompts_full</text>
  <text x="392" y="324" class="small">skills_full + category</text>
  <text x="392" y="344" class="small">source of catalog export</text>

  <rect x="650" y="250" width="205" height="96" rx="18" class="box gate"/>
  <text x="678" y="286" class="label">catalog:export</text>
  <text x="678" y="314" class="small">export-catalog-data.mjs</text>
  <text x="678" y="334" class="small">split six JSON files</text>

  <rect x="930" y="195" width="210" height="210" rx="18" class="box data"/>
  <text x="958" y="232" class="label">public/catalog</text>
  <text x="958" y="262" class="small">prompt 201</text>
  <text x="958" y="282" class="small">skill 314</text>
  <text x="958" y="302" class="small">hook 80 / mcp 80</text>
  <text x="958" y="322" class="small">agent 81 / github 95</text>
  <text x="958" y="352" class="small">total 851</text>

  <rect x="1200" y="235" width="135" height="126" rx="18" class="box deploy"/>
  <text x="1222" y="275" class="label">Runtime</text>
  <text x="1222" y="304" class="small">Vite build</text>
  <text x="1222" y="324" class="small">Docker app</text>
  <text x="1222" y="344" class="small">nginx/browser</text>

  <path d="M295 298 H365" class="arrow"/>
  <path d="M575 298 H650" class="arrow"/>
  <path d="M855 298 H930" class="arrow"/>
  <path d="M1140 298 H1200" class="arrow"/>

  <rect x="100" y="620" width="360" height="150" rx="20" class="box gate"/>
  <text x="130" y="662" class="label">Derived Baselines</text>
  <text x="130" y="692" class="small">catalogMeta.ts / README.md / smoke-e2e.mjs</text>
  <text x="130" y="716" class="small">risk: count drift when content changes</text>

  <rect x="540" y="620" width="360" height="150" rx="20" class="box warn"/>
  <text x="570" y="662" class="label">Quality Gates</text>
  <text x="570" y="692" class="small">verify + docs check + Vitest + build + audit</text>
  <text x="570" y="716" class="small">Playwright smoke validates real pages</text>

  <rect x="980" y="620" width="360" height="150" rx="20" class="box future"/>
  <text x="1010" y="662" class="label">Future Admin Publishing</text>
  <text x="1010" y="692" class="small">PostgreSQL + deploy-worker + catalog_versions</text>
  <text x="1010" y="716" class="small">designed, not current production path</text>

  <path d="M1035 405 C780 500, 370 520, 280 620" class="arrow dash"/>
  <path d="M1035 405 C820 530, 720 530, 720 620" class="arrow dash"/>
  <path d="M1035 405 C1060 520, 1160 520, 1160 620" class="arrow dash"/>
</svg>
